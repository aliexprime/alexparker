<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alex Parker</title>
  <meta name="description" content="Alex Parker">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f7f6f3'/%3E%3Crect x='5' y='4' width='6' height='8' fill='%23cadde4'/%3E%3Crect x='6' y='8' width='4' height='4' fill='%23d7ae66'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f6f3;
      --text: #171717;
      --muted: rgba(23, 23, 23, 0.45);
      --muted-2: rgba(23, 23, 23, 0.25);
      --hair: rgba(0, 0, 0, 0.09);
      --sheet: #fbfaf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- The world ------------------------------------------------------ */

    canvas#stage {
      /* Sized in script, not here. The scene renders small and is scaled up,
         and it is scaled by a whole number of device pixels so that every
         pixel is the same square — which means the canvas comes out a fraction
         larger than the window, and is centred with the overflow clipped. A
         percentage width would put us back to a fractional scale and an uneven
         grid, which is the thing this is all avoiding. */
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      z-index: 0;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: grab;
      opacity: 0;
      transition: opacity 900ms ease;
    }
    body.loaded canvas#stage { opacity: 1; }
    body.dragging canvas#stage { cursor: grabbing; }
    body.overzone canvas#stage { cursor: pointer; }

    /* ---- Type ----------------------------------------------------------- */

    .mono,
    .brand,
    .contact,
    .visitor,
    .hint,
    .eyebrow,
    .sheet-close,
    .item-tag {
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ---- Header --------------------------------------------------------- */

    .header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      pointer-events: none;
      padding: calc(24px + env(safe-area-inset-top)) 20px 0;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .brand { color: var(--muted); justify-self: start; }
    .visitor {
      justify-self: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .contact {
      justify-self: end;
      color: var(--muted-2);
      pointer-events: auto;
      transition: color 180ms ease;
    }
    .contact:hover { color: var(--text); }

    /* ---- Hint ----------------------------------------------------------- */

    .hint {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(26px + env(safe-area-inset-bottom));
      z-index: 20;
      color: var(--muted-2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 700ms ease;
      text-shadow: 0 0 5px var(--bg), 0 0 10px var(--bg), 0 0 16px var(--bg);
    }
    body.loaded .hint { opacity: 1; }
    body.touched .hint, body.form-open .hint { opacity: 0; }

    /* ---- The message form ------------------------------------------------

       The only HTML the site has left. Everything else a visitor reads is
       printed into the world in the pixel font — you just cannot type into a
       mesh, so this one thing is a dialog. */

    .dialog {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(247, 246, 243, 0.72);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }
    body.form-open .dialog { opacity: 1; pointer-events: auto; }

    .sheet {
      width: min(460px, 100%);
      max-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--sheet);
      border: 2px solid var(--text);
      /* A hard offset instead of a soft shadow — the whole site is square. */
      box-shadow: 8px 8px 0 rgba(23, 23, 23, 0.16);
      padding: 26px 26px calc(26px + env(safe-area-inset-bottom));
      transform: translateY(10px) scale(0.98);
      transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.form-open .sheet { transform: none; }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .sheet-close {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: 0;
      padding: 2px 0 2px 12px;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      transition: color 180ms ease;
    }
    .sheet-close:hover { color: var(--text); }

    .sheet-title {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 500;
      margin: 14px 0 0;
    }

    /* ---- Pixel-art form -------------------------------------------------- */

    .field { display: block; margin: 20px 0 0; }
    .field span {
      display: block;
      margin-bottom: 8px;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .px-input {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      border: 2px solid rgba(23, 23, 23, 0.3);
      border-radius: 0;
      padding: 11px 12px;
      /* A hard offset instead of a soft shadow — the whole site is square. */
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.09);
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .px-input:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.22);
    }
    textarea.px-input { resize: vertical; min-height: 96px; }

    .px-btn {
      margin-top: 26px;
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--bg);
      border: 2px solid var(--text);
      border-radius: 0;
      padding: 13px 26px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--text);
      transition: transform 90ms ease, box-shadow 90ms ease;
    }
    .px-btn:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0 var(--text); }
    .px-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--text); }

    .field-note {
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }
    .field-note.bad { color: #a33f2f; }

    @media (prefers-reduced-motion: reduce) {
      .dialog, .sheet, canvas#stage, .hint { transition-duration: 1ms; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="An interactive pixel-art world. Every section of it is a part of Alex Parker's work, and everything it says is written into the world itself: tap a section to move in close, and tap a sign, a board, a screen or an object to read it."></canvas>

  <header class="header">
    <div class="header-inner">
      <div class="brand">Alex Parker</div>
      <div class="visitor" id="counter" aria-label="Visitor count">0</div>
      <a class="contact" href="mailto:hello@alexparker.au">Contact</a>
    </div>
  </header>

  <div class="hint" id="hint">Drag to orbit &middot; Scroll to zoom in close</div>

  <!-- Opened by tapping one of the four lines on the chart in the ward. -->
  <div class="dialog" id="formDialog" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="sheet">
      <div class="sheet-head">
        <div class="eyebrow">RLDatix</div>
        <button class="sheet-close" id="formClose" type="button">Close</button>
      </div>
      <h1 class="sheet-title" id="formTitle"></h1>
      <form id="contactForm" novalidate>
        <label class="field">
          <span>Name</span>
          <input class="px-input" id="fName" name="name" autocomplete="name" required>
        </label>
        <label class="field">
          <span>Email</span>
          <input class="px-input" id="fEmail" name="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Message</span>
          <textarea class="px-input" id="fMsg" name="message" rows="5" required></textarea>
        </label>
        <button class="px-btn" type="submit">Send</button>
        <p class="field-note" id="formNote">Opens your email app with this filled in.</p>
      </form>
    </div>
  </div>

  <script type="module" src="./world.js"></script>
</body>
</html>
