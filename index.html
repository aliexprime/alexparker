<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alex Parker</title>
  <meta name="description" content="Alex Parker">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f7f6f3'/%3E%3Crect x='5' y='4' width='6' height='8' fill='%23cadde4'/%3E%3Crect x='6' y='8' width='4' height='4' fill='%23d7ae66'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f6f3;
      --text: #171717;
      --muted: rgba(23, 23, 23, 0.45);
      --muted-2: rgba(23, 23, 23, 0.25);
      --hair: rgba(0, 0, 0, 0.09);
      --sheet: #fbfaf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- The world ------------------------------------------------------ */

    canvas#stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      touch-action: none;
      /* The scene renders small and is scaled up here — this is what makes
         real 3D read as pixel art. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: grab;
      opacity: 0;
      transition: opacity 900ms ease;
    }
    body.loaded canvas#stage { opacity: 1; }
    body.dragging canvas#stage { cursor: grabbing; }
    body.overzone canvas#stage { cursor: pointer; }

    /* ---- Type ----------------------------------------------------------- */

    .mono,
    .brand,
    .contact,
    .visitor,
    .hint,
    .eyebrow,
    .panel-close,
    .item-tag {
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ---- Header --------------------------------------------------------- */

    .header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      pointer-events: none;
      padding: calc(24px + env(safe-area-inset-top)) 20px 0;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .brand { color: var(--muted); justify-self: start; }
    .visitor {
      justify-self: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .contact {
      justify-self: end;
      color: var(--muted-2);
      pointer-events: auto;
      transition: color 180ms ease;
    }
    .contact:hover { color: var(--text); }

    /* ---- Hint ----------------------------------------------------------- */

    .hint {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(26px + env(safe-area-inset-bottom));
      z-index: 20;
      color: var(--muted-2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 700ms ease;
      text-shadow: 0 0 5px var(--bg), 0 0 10px var(--bg), 0 0 16px var(--bg);
    }
    body.loaded .hint { opacity: 1; }
    body.touched .hint, body.panel-open .hint { opacity: 0; }

    /* ---- Panel ---------------------------------------------------------- */

    .panel {
      position: fixed;
      z-index: 30;
      background: var(--sheet);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1), opacity 320ms ease;
      opacity: 0;
      pointer-events: none;
    }
    body.panel-open .panel { opacity: 1; pointer-events: auto; }

    @media (min-width: 861px) {
      .panel {
        top: 0;
        right: 0;
        bottom: 0;
        width: min(430px, 40vw);
        border-left: 1px solid var(--hair);
        transform: translateX(100%);
      }
      body.panel-open .panel { transform: translateX(0); }
    }
    @media (max-width: 860px) {
      .panel {
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 58vh;
        border-top: 1px solid var(--hair);
        transform: translateY(100%);
      }
      body.panel-open .panel { transform: translateY(0); }
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: calc(26px + env(safe-area-inset-top)) 28px 0;
      flex: 0 0 auto;
    }
    @media (max-width: 860px) {
      .panel-head { padding: 22px 22px 0; }
    }

    .eyebrow { color: var(--muted-2); }

    .panel-close {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: 0;
      padding: 4px 0 4px 12px;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      transition: color 180ms ease;
    }
    .panel-close:hover { color: var(--text); }

    .panel-body {
      padding: 20px 28px calc(36px + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
    }
    @media (max-width: 860px) {
      .panel-body { padding: 16px 22px calc(28px + env(safe-area-inset-bottom)); }
    }

    .panel-title {
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-weight: 500;
      margin: 14px 0 0;
    }
    .panel-lede {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(23, 23, 23, 0.72);
      margin: 16px 0 0;
    }
    .panel-body p {
      font-size: 14px;
      line-height: 1.68;
      color: rgba(23, 23, 23, 0.62);
      margin: 14px 0 0;
    }

    .items { margin: 30px 0 0; border-top: 1px solid var(--hair); }
    .item {
      padding: 15px 0;
      border-bottom: 1px solid var(--hair);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: baseline;
    }
    .item-name {
      font-size: 14px;
      line-height: 1.35;
      color: var(--text);
    }
    .item-name a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(23, 23, 23, 0.22);
      transition: border-color 180ms ease;
    }
    .item-name a:hover { border-bottom-color: var(--text); }

    .item-tag { color: var(--muted-2); }
    .item-note {
      grid-column: 1 / -1;
      font-size: 13px;
      line-height: 1.6;
      color: rgba(23, 23, 23, 0.55);
    }

    .todo {
      margin-top: 30px;
      padding: 12px 14px;
      border: 1px dashed rgba(23, 23, 23, 0.18);
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }


    /* ---- Pages, and the turn between them ------------------------------- */

    .page {
      transform-origin: left center;
      backface-visibility: hidden;
    }
    body.turning .page {
      transition: transform 220ms ease-in, opacity 200ms ease-in;
      transform: rotateY(-72deg);
      opacity: 0;
    }
    .page.arriving {
      animation: pageIn 260ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes pageIn {
      from { transform: rotateY(58deg); opacity: 0; }
      to   { transform: rotateY(0deg); opacity: 1; }
    }
    #panelBody { perspective: 1400px; }

    .page-back {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: 0;
      padding: 0 0 14px;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      transition: color 180ms ease;
    }
    .page-back:hover { color: var(--text); }

    /* ---- Choices (the lines on the chart) -------------------------------- */

    .choices:not(:empty) { margin: 26px 0 0; border-top: 1px solid var(--hair); }
    .choice {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--hair);
      padding: 15px 2px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      text-align: left;
      transition: padding-left 180ms ease, color 180ms ease;
    }
    .choice::after {
      content: "\2192";
      color: var(--muted-2);
      transition: transform 180ms ease, color 180ms ease;
    }
    .choice:hover { padding-left: 8px; }
    .choice:hover::after { color: var(--text); transform: translateX(4px); }

    /* ---- Pixel-art form -------------------------------------------------- */

    .field { display: block; margin: 20px 0 0; }
    .field span {
      display: block;
      margin-bottom: 8px;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .px-input {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      border: 2px solid rgba(23, 23, 23, 0.3);
      border-radius: 0;
      padding: 11px 12px;
      /* A hard offset instead of a soft shadow — the whole site is square. */
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.09);
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .px-input:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.22);
    }
    textarea.px-input { resize: vertical; min-height: 96px; }

    .px-btn {
      margin-top: 26px;
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--bg);
      border: 2px solid var(--text);
      border-radius: 0;
      padding: 13px 26px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--text);
      transition: transform 90ms ease, box-shadow 90ms ease;
    }
    .px-btn:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0 var(--text); }
    .px-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--text); }

    .field-note {
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }
    .field-note.bad { color: #a33f2f; }

    @media (prefers-reduced-motion: reduce) {
      .panel, canvas#stage, .hint { transition-duration: 1ms; }
      .page, .page.arriving { animation: none; transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="An interactive pixel-art world. Each area of the room is a part of Alex Parker's work; select one to read about it."></canvas>

  <header class="header">
    <div class="header-inner">
      <div class="brand">Alex Parker</div>
      <div class="visitor" id="counter" aria-label="Visitor count">0</div>
      <a class="contact" href="mailto:hello@alexparker.au">Contact</a>
    </div>
  </header>

  <div class="hint" id="hint">Drag to orbit &middot; Scroll to zoom in close</div>

  <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
    <div class="panel-head">
      <div class="eyebrow" id="panelEyebrow"></div>
      <button class="panel-close" id="panelClose" type="button">Close</button>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="page" id="pageMain">
        <h1 class="panel-title" id="panelTitle"></h1>
        <p class="panel-lede" id="panelLede"></p>
        <div id="panelText"></div>
        <div class="items" id="panelItems"></div>
        <div class="choices" id="panelChoices"></div>
        <div class="todo" id="panelTodo" hidden></div>
      </div>

      <div class="page" id="pageForm" hidden>
        <button class="page-back" id="formBack" type="button">&larr; Back</button>
        <h1 class="panel-title" id="formTitle"></h1>
        <form id="contactForm" novalidate>
          <label class="field">
            <span>Name</span>
            <input class="px-input" id="fName" name="name" autocomplete="name" required>
          </label>
          <label class="field">
            <span>Email</span>
            <input class="px-input" id="fEmail" name="email" type="email" autocomplete="email" required>
          </label>
          <label class="field">
            <span>Message</span>
            <textarea class="px-input" id="fMsg" name="message" rows="5" required></textarea>
          </label>
          <button class="px-btn" type="submit">Send</button>
          <p class="field-note" id="formNote">Opens your email app with this filled in.</p>
        </form>
      </div>
    </div>
  </aside>

  <script type="module" src="./world.js"></script>
</body>
</html>
