<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alex Parker</title>
  <meta name="description" content="Alex Parker">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f7f6f3'/%3E%3Crect x='5' y='4' width='6' height='8' fill='%23cadde4'/%3E%3Crect x='6' y='8' width='4' height='4' fill='%23d7ae66'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f6f3;
      --text: #171717;
      --muted: rgba(23, 23, 23, 0.45);
      --muted-2: rgba(23, 23, 23, 0.25);
      --hair: rgba(0, 0, 0, 0.09);
      --sheet: #fbfaf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- The world ------------------------------------------------------ */

    canvas#stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      touch-action: none;
      /* The scene renders small and is scaled up here — this is what makes
         real 3D read as pixel art. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: grab;
      opacity: 0;
      transition: opacity 900ms ease;
    }
    body.loaded canvas#stage { opacity: 1; }
    body.dragging canvas#stage { cursor: grabbing; }
    body.overzone canvas#stage { cursor: pointer; }

    /* ---- Type ----------------------------------------------------------- */

    .mono,
    .brand,
    .contact,
    .visitor,
    .hint,
    .eyebrow,
    .panel-close,
    .item-tag {
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ---- Header --------------------------------------------------------- */

    .header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      pointer-events: none;
      padding: calc(24px + env(safe-area-inset-top)) 20px 0;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .brand { color: var(--muted); justify-self: start; }
    .visitor {
      justify-self: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .contact {
      justify-self: end;
      color: var(--muted-2);
      pointer-events: auto;
      transition: color 180ms ease;
    }
    .contact:hover { color: var(--text); }

    /* ---- Hint ----------------------------------------------------------- */

    .hint {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(26px + env(safe-area-inset-bottom));
      z-index: 20;
      color: var(--muted-2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 700ms ease;
      text-shadow: 0 0 5px var(--bg), 0 0 10px var(--bg), 0 0 16px var(--bg);
    }
    body.loaded .hint { opacity: 1; }
    body.touched .hint, body.panel-open .hint { opacity: 0; }

    /* ---- Panel ---------------------------------------------------------- */

    .panel {
      position: fixed;
      z-index: 30;
      background: var(--sheet);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1), opacity 320ms ease;
      opacity: 0;
      pointer-events: none;
    }
    body.panel-open .panel { opacity: 1; pointer-events: auto; }

    @media (min-width: 861px) {
      .panel {
        top: 0;
        right: 0;
        bottom: 0;
        width: min(430px, 40vw);
        border-left: 1px solid var(--hair);
        transform: translateX(100%);
      }
      body.panel-open .panel { transform: translateX(0); }
    }
    @media (max-width: 860px) {
      .panel {
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 58vh;
        border-top: 1px solid var(--hair);
        transform: translateY(100%);
      }
      body.panel-open .panel { transform: translateY(0); }
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: calc(26px + env(safe-area-inset-top)) 28px 0;
      flex: 0 0 auto;
    }
    @media (max-width: 860px) {
      .panel-head { padding: 22px 22px 0; }
    }

    .eyebrow { color: var(--muted-2); }

    .panel-close {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: 0;
      padding: 4px 0 4px 12px;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      transition: color 180ms ease;
    }
    .panel-close:hover { color: var(--text); }

    .panel-body {
      padding: 20px 28px calc(36px + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
    }
    @media (max-width: 860px) {
      .panel-body { padding: 16px 22px calc(28px + env(safe-area-inset-bottom)); }
    }

    .panel-title {
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-weight: 500;
      margin: 14px 0 0;
    }
    .panel-lede {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(23, 23, 23, 0.72);
      margin: 16px 0 0;
    }
    .panel-body p {
      font-size: 14px;
      line-height: 1.68;
      color: rgba(23, 23, 23, 0.62);
      margin: 14px 0 0;
    }

    .items { margin: 30px 0 0; border-top: 1px solid var(--hair); }
    .item {
      padding: 15px 0;
      border-bottom: 1px solid var(--hair);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: baseline;
    }
    .item-name {
      font-size: 14px;
      line-height: 1.35;
      color: var(--text);
    }
    .item-tag { color: var(--muted-2); }
    .item-note {
      grid-column: 1 / -1;
      font-size: 13px;
      line-height: 1.6;
      color: rgba(23, 23, 23, 0.55);
    }

    .todo {
      margin-top: 30px;
      padding: 12px 14px;
      border: 1px dashed rgba(23, 23, 23, 0.18);
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .panel, canvas#stage, .hint { transition-duration: 1ms; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="An interactive pixel-art world. Each area of the room is a part of Alex Parker's work; select one to read about it."></canvas>

  <header class="header">
    <div class="header-inner">
      <div class="brand">Alex Parker</div>
      <div class="visitor" id="counter" aria-label="Visitor count">0</div>
      <a class="contact" href="mailto:hello@alexparker.au">Contact</a>
    </div>
  </header>

  <div class="hint" id="hint">Drag to orbit &middot; Select a scene</div>

  <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
    <div class="panel-head">
      <div class="eyebrow" id="panelEyebrow"></div>
      <button class="panel-close" id="panelClose" type="button">Close</button>
    </div>
    <div class="panel-body">
      <h1 class="panel-title" id="panelTitle"></h1>
      <p class="panel-lede" id="panelLede"></p>
      <div id="panelText"></div>
      <div class="items" id="panelItems"></div>
      <div class="todo" id="panelTodo" hidden></div>
    </div>
  </aside>

  <script type="module" src="./world.js"></script>
</body>
</html>
